; PlatformIO version of the blink example, for projects installing Ticker
; from the PlatformIO registry rather than vendoring the source.
;
; Sitting inside the library, this picks Ticker up automatically. Copied out
; into a project of your own, add the dependency explicitly:
;
;   lib_deps = fyfar/Ticker

[env:genericCH32V003F4P6]
platform = ch32v
board = genericCH32V003F4P6
framework = ch32v003fun
